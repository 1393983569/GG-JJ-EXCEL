services:
  pb:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./pb_migrations:/pb/pb_migrations:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pb]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pb_public:/srv/admin:ro
      - ./h5/dist:/srv/h5:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
